<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo 3D - Playset Light Test</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f1f1f, #0a0a0a 60%);
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: #f2f2f2;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 14px 18px;
      max-width: 360px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid #b21f1f;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      font-size: 14px;
      line-height: 1.6;
    }

    .info strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(178, 31, 31, 0.2);
      border: 1px solid rgba(178, 31, 31, 0.5);
      color: #f2f2f2;
    }
  </style>
</head>
<body>
  <div class="info">
    <strong>Playset Light Test</strong>
    Modelo glTF para prueba de iluminacion. Arrastra para rotar, usa scroll para zoom.
    <span class="badge">glb + Model Viewer</span>
  </div>

  <model-viewer
    src="../Models/PlaysetLightTest/glTF-Binary/PlaysetLightTest.glb"
    poster="../Models/PlaysetLightTest/screenshot/screenshot_large.jpg"
    alt="Playset Light Test"
    auto-rotate
    autoplay
    camera-controls
    interaction-prompt="auto"
    exposure="1"
    shadow-intensity="1">
  </model-viewer>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</body>
</html>
